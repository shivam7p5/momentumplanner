<style>

.b:hover{filter:brightness(1.1)}.b:active{filter:brightness(.92)}.b.gh{background:transparent;border-color:var(--bd);color:var(--tx)}.b.gh:hover{background:var(--s2);filter:none}
.x{background:none;border:0;color:var(--mu);cursor:pointer;font-size:14px;padding:4px;border-radius:6px;line-height:1}.x:hover{color:var(--bad)}

input:hover,select:hover,textarea:hover{border-color:var(--mu)}input:focus,textarea:focus,select:focus{outline:0;border-color:var(--pr)}

@media(hover:none){.del{opacity:.5}}
.add{display:flex;gap:8px;margin-top:16px}.add input{flex:1;min-width:0}
.empty{color:var(--mu);padding:8px 0;font-size:13px}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.bars i{display:block;background:var(--pr);opacity:.85;border-radius:4px 4px 0 0;margin-bottom:4px;min-height:2px}
.lbl{font-size:12.5px;color:var(--mu);margin:16px 0 8px}

.i-sun{display:none}:root[data-theme=dark] .i-sun{display:block}:root[data-theme=dark] .i-moon{display:none}
#email{font-size:12px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rate{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;flex:1}
.rate button{height:36px;border:1px solid var(--bd);background:var(--inp);color:var(--mu);border-radius:8px;font:inherit;font-weight:500;cursor:pointer;transition:.15s}
.rate button:hover{border-color:var(--mu);color:var(--tx)}.rate button.on{background:var(--pr);border-color:var(--pr);color:#fff}
.rate button.fill{background:color-mix(in srgb,var(--pr) 16%,var(--inp));border-color:color-mix(in srgb,var(--pr) 35%,var(--bd));color:var(--pr2)}

.wkp{padding:16px 24px;margin-bottom:16px}.wkp b{font-size:18px;font-weight:600}.wkp .bar{margin-top:12px}
.stat .bar{margin-top:16px}.stat .sub{display:block;margin-top:8px}
.tc{display:flex;align-items:flex-end;gap:12px;height:176px}
.tc>div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;font-size:11.5px;color:var(--mu)}
.tc .tb{width:100%;max-width:40px;background:var(--s2);border-radius:4px 4px 0 0;position:relative;min-height:3px}
.tc .tb i{position:absolute;left:0;right:0;bottom:0;background:var(--pr);border-radius:4px 4px 0 0}
.tc .on{color:var(--tx)}.tc small{font-size:11.5px}
.dn{display:flex;gap:24px;align-items:center;flex-wrap:wrap}.dn svg{flex:none}
.lg{flex:1;min-width:150px;display:grid;gap:8px}.lg div{display:flex;align-items:center;gap:8px;font-size:13px}.lg i{width:8px;height:8px;border-radius:50%;flex:none}.lg span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(min-width:721px) and (max-width:900px){nav svg{display:none}#sync{display:none}nav button{padding:7px 9px}}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:900px){#email{display:none}}
@media(max-width:720px){
 .ng{display:contents}nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;width:100%;gap:0;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd)}
 nav button{flex:1;flex-direction:column;gap:3px;padding:6px 0;font-size:11px;min-width:0}nav button.on,nav button:hover{background:none}nav svg{width:20px;height:20px}
 main{padding:24px 16px 100px}.c{padding:16px}#sync{display:none}.strip{gap:4px}.g2{grid-template-columns:1fr}}
#auth{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px}
.ac{width:100%;max-width:380px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:32px 24px}
.ac form{display:grid;gap:12px;margin-top:16px}.ac input{width:100%}.ac .b{padding:10px}
.tabs{display:flex;gap:2px;background:var(--s2);padding:3px;border-radius:8px;margin-top:16px}.tabs button{flex:1;border:0;background:none;color:var(--mu);padding:7px;border-radius:6px;font:inherit;font-weight:500;cursor:pointer}.tabs button.on{background:var(--card);color:var(--tx)}
#amsg{font-size:12.5px;border-radius:8px;padding:8px 12px;display:none}#amsg.e{display:block;background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}#amsg.k{display:block;background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
#appWrap[hidden]{display:none}

<button class="ib" data-a="theme" aria-label="Toggle light/dark mode" title="Light / dark"><svg class="i-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="i-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
<button class="ib" id="out" aria-label="Sign out" title="Sign out"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button></div></div></header>

<script>
/* ============ STATE (local-first; saved to this browser) ============ */
const uid=()=>Math.random().toString(36).slice(2,9);
const DEF_H=[['Wake up at 6:00',''],['Drink water',''],['Move your body',''],['Read 10 pages',''],['Plan tomorrow','']];
let S=null,lastJ='',db,UID,tmr,unsub;
const seed=()=>{const sub=a=>a.map(n=>({id:uid(),n,d:false}));
 const SK=[['DSA',['C++','Arrays','Strings','Linked Lists']],['Development',['HTML/CSS','JavaScript','React','Backend']],['AI/ML',['Python','Math basics','ML algorithms','Projects']],['Video Editing',['Cutting','Color grading','Audio','Reels']],['Communication',['Speaking','Writing','Interviews']],['Workout',['Strength','Cardio','Mobility']]].map(([n,s])=>({id:uid(),n,subs:sub(s),notes:''}));
 const sid=n=>SK.find(s=>s.n===n).id,G=(t,d,k)=>({id:uid(),t,lv:'long',d,st:'On track',par:'',sks:k.map(sid),ms:[]});
 return {theme:'dark',hw:{},hlog:{},tasks:[],rev:{},focus:{},skills:SK,goals:[G('Get a good placement','2029-06-01',['DSA','Development','AI/ML','Communication']),G('Build a video editing side income','2028-12-01',['Video Editing']),G('Become a better version of myself','2029-06-01',['Workout','Communication'])]};}
/* ============ CLOUD SYNC (Firestore: planners/{uid}.v3) ============ */
const canon=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.fromEntries(Object.keys(v).sort().map(x=>[x,v[x]])):v);
const sync=t=>{const e=document.getElementById('sync');if(e)e.textContent=t};
const save=()=>{if(!S||!UID)return;const j=canon(S);if(j===lastJ)return;lastJ=j;clearTimeout(tmr);sync('Saving…');
 tmr=setTimeout(()=>db.collection('planners').doc(UID).set({v3:JSON.parse(JSON.stringify(S)),updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{mergeFields:['v3','updatedAt']})
  .then(()=>sync('Synced')).catch(()=>sync('Offline — retrying')),500)};
/* ============ DATE HELPERS ============ */
const iso=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const P=s=>new Date(s+'T00:00:00'),add=(s,n)=>{const d=P(s);d.setDate(d.getDate()+n);return iso(d)};
const mon=s=>add(s,-((P(s).getDay()+6)%7)),T=iso(new Date());
const DN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],fmt=s=>P(s).toLocaleDateString(undefined,{day:'numeric',month:'short'});
const V={page:'day',wk:mon(T),day:T,mo:T.slice(0,7)};
/* progress is DERIVED from ticked boxes: skill = done subtopics; goal = avg of linked skills, child goals, own milestones */
const sp=s=>s.subs.length?Math.round(s.subs.filter(x=>x.d).length/s.subs.length*100):0;
const gp=g=>{const c=[],sk=(g.sks||[]).map(i=>S.skills.find(s=>s.id===i)).filter(Boolean),ch=S.goals.filter(x=>x.par===g.id);
 if(sk.length)c.push(sk.reduce((a,s)=>a+sp(s),0)/sk.length);if(ch.length)c.push(ch.reduce((a,x)=>a+gp(x),0)/ch.length);
 if(g.ms.length)c.push(g.ms.filter(m=>m.d).length/g.ms.length*100);return c.length?Math.round(c.reduce((a,b)=>a+b)/c.length):0};
const gst=g=>gp(g)>=100?'Completed':g.st;
const cl=(a,tg,dl,k)=>a.map(x=>`<div class="tk"><span class="stamp ${x.d?'done':''}" data-a="${tg}" data-v="${x.id}" data-k="${k}"></span><span class="txt ${x.d?'done':''}">${esc(x.n)}</span><button class="del" data-a="${dl}" data-v="${x.id}" data-k="${k}">×</button></div>`).join('');

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ============ HABITS — stored PER WEEK ============
 S.hw[weekMonday] = list of habits for that week only. A week with no list inherits a
 copy of the most recent earlier week; after that, edits never touch other weeks. */
const inherit=wk=>{const p=Object.keys(S.hw).filter(k=>k<wk).sort().pop();return p?S.hw[p].map(h=>({...h})):DEF_H.map(([n,i],k)=>({id:'dh'+k,n,i,t:7}))};
const hlr=wk=>S.hw[wk]||inherit(wk);          // read (no write)
const hl=wk=>S.hw[wk]||(S.hw[wk]=inherit(wk));// write (locks the week's own list)
const dd=d=>{const g=S.hlog[d]||{};return hlr(mon(d)).filter(h=>g[h.id]).length};
const dp=d=>{const n=hlr(mon(d)).length;return n?dd(d)/n:0};
const wp=wk=>{let s=0,n=0;for(let i=0;i<7;i++){const d=add(wk,i);if(d<=T){s+=dp(d);n++}}return n?s/n:0};
const mdays=m=>{const o=[],n=new Date(+m.slice(0,4),+m.slice(5),0).getDate();for(let i=1;i<=n;i++)o.push(m+'-'+String(i).padStart(2,'0'));return o};
const mp=m=>{const a=mdays(m).filter(d=>d<=T);return a.length?a.reduce((s,d)=>s+dp(d),0)/a.length:0};
function streaks(){let c=0,d=dd(T)?T:add(T,-1);while(dd(d)){c++;d=add(d,-1)}
 let b=0,r=0,pv=null;Object.keys(S.hlog).filter(dd).sort().forEach(x=>{r=pv&&add(pv,1)===x?r+1:1;pv=x;b=Math.max(b,r)});return[c,b]}
function topHabit(){const c={};mdays(T.slice(0,7)).forEach(d=>hlr(mon(d)).forEach(h=>{if((S.hlog[d]||{})[h.id])c[h.n]=(c[h.n]||0)+1}));
 const k=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];return k?k[0]:'—'}
/* ============ SMALL UI HELPERS ============ */
const pc=x=>Math.round(x*100);
const bar=p=>`<div class="bar"><i style="width:${Math.max(0,Math.min(100,p))}%"></i></div>`;
const ring=(p,l)=>`<svg width="74" height="74" viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="var(--s2)" stroke-width="5"/><circle cx="32" cy="32" r="26" fill="none" stroke="var(--pr2)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${p*1.634} 163.4" transform="rotate(-90 32 32)" style="transition:stroke-dasharray .8s"/><text x="32" y="36" text-anchor="middle" font-size="13" font-weight="700" fill="var(--tx)">${l??Math.round(p)+'%'}</text></svg>`;
const LV={long:'Long-term (3–4 yrs)',year:'Yearly / Semester',month:'Monthly'};
const sname=id=>(S.skills.find(s=>s.id===id)||{}).n;

/* ============ PAGES ============ */
